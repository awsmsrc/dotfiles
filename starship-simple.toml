# ============================================================================
# Starship Configuration - Simple/Fallback Version
# ============================================================================
#
# This version uses basic ASCII characters that work without Nerd Fonts
# Use this if you're having rendering issues in your terminal
#
# To use: ln -sf ~/dotfiles/starship-simple.toml ~/.config/starship.toml
#
# ============================================================================

# Timeout for commands (in milliseconds)
command_timeout = 1000

# Simple format (multi-line, no fancy Unicode)
format = """$directory$git_branch$git_status
$character"""

# Continuation prompt
continuation_prompt = "> "

# ============================================================================
# Character (the prompt symbol)
# ============================================================================

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

# ============================================================================
# Directory
# ============================================================================

[directory]
truncation_length = 0
truncate_to_repo = false
format = "[$path]($style) "
style = "bold cyan"
read_only = " [RO]"
read_only_style = "red"

# ============================================================================
# Git Branch
# ============================================================================

[git_branch]
symbol = "git:"
format = "on [$symbol$branch]($style) "
style = "bold purple"
truncation_length = 30
truncation_symbol = "..."

# ============================================================================
# Git Status
# ============================================================================

[git_status]
format = '([OK](bold green) )([$all_status$ahead_behind](bold red) )'
style = "bold red"
conflicted = "CONFLICT "
ahead = "^${count}"
behind = "v${count}"
diverged = "^${ahead_count}v${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = ">>${count}"
deleted = "X${count}"
